name: Backend CI/CD Pipeline (Docker)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-test-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest
    # Cần cấp quyền write packages để GitHub Actions có thể đẩy Image lên GHCR
    permissions:
      contents: read
      packages: write

    # Khởi tạo một Database PostgreSQL tạm thời để chạy integration test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: urmyfood
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Bước này chạy test và đồng thời build ra file .jar (lưu ở target/backend-0.0.1-SNAPSHOT.jar)
      - name: Run Tests and Build JAR
        run: ./mvnw clean package

      - name: Convert repository name to lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }}-backend | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Chỉ đăng nhập và đẩy lên Docker Registry nếu là sự kiện PUSH (không đẩy khi Pull Request)
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Render (CD)
    needs: build-test-and-push
    # Chỉ chạy deploy khi là sự kiện PUSH vào dev hoặc main
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment for Dev
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_DEV secret is not set."
            exit 1
          fi
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"
          echo "Triggered Dev deployment on Render."

      - name: Trigger Render Deployment for Main
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_MAIN }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_MAIN secret is not set."
            exit 1
          fi
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_MAIN }}"
          echo "Triggered Main deployment on Render."
