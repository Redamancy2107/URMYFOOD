name: CI/CD Deploy to Render

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io
  # Lưu tên image dưới dạng viết thường
  IMAGE_NAME: redamancy2107/urmyfood

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    # Khởi chạy dịch vụ PostgreSQL container trong GitHub Runner để test kết nối & chạy Flyway migration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urmyfood
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy kiểm thử và build thử để đảm bảo code không lỗi trước khi đóng gói Docker
      - name: Run Tests and Build (CI Check)
        run: |
          cd backend
          mvn clean package

      # Smoke Test: Khởi chạy thử ứng dụng để đảm bảo nó khởi động thành công với môi trường DB thật
      - name: Run Startup Smoke Test (Verify Production Startup)
        run: |
          echo "Starting Spring Boot application in background..."
          # Đặt các tham số cấu hình trỏ vào DB Postgres đang chạy service
          java -jar backend/target/*.jar \
            --spring.profiles.active=prod \
            --DB_URL=jdbc:postgresql://localhost:5432/urmyfood \
            --DB_USERNAME=postgres \
            --DB_PASSWORD=password \
            --JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 \
            --SPRINGDOC_ENABLED=false > app.log 2>&1 &
          
          # Lưu PID của tiến trình Java
          APP_PID=$!
          
          # Chờ tối đa 60 giây và kiểm tra endpoint /actuator/health
          echo "Waiting for health check (actuator/health)..."
          success=false
          for i in {1..20}; do
            # Kiểm tra xem tiến trình Java còn sống không (tránh vòng lặp chạy vô hạn nếu app bị crash ngay)
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: Application crashed immediately on startup!"
              echo "=== Application logs ==="
              cat app.log
              exit 1
            fi
            
            # Gửi request kiểm tra health
            RESPONSE=$(curl -s http://localhost:8080/actuator/health || true)
            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "SUCCESS: Application started successfully and is healthy!"
              success=true
              break
            fi
            
            echo "Health status: $RESPONSE. Retrying in 3s..."
            sleep 3
          done
          
          # Dọn dẹp tiến trình Java chạy ngầm
          kill $APP_PID || true
          
          if [ "$success" = false ]; then
            echo "ERROR: Application startup timed out after 60s!"
            echo "=== Application logs ==="
            cat app.log
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        # Chỉ đăng nhập khi thực sự cần push image (không phải PR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ github.ref_name }}
            type=sha,value=${{ github.sha }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Chỉ push Docker image lên registry khi sự kiện KHÔNG phải là pull_request
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger Deploy lên Render tương ứng với từng nhánh thông qua Deploy Hook
      - name: Trigger Render Deploy (Dev Branch)
        if: github.event_name != 'pull_request' && github.ref_name == 'dev'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

      - name: Trigger Render Deploy (Main Branch)
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
