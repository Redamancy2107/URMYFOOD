name: PR Discord Notification

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, closed, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: appleboy/discord-action@v1.1.0
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Monitor"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          color: ${{ github.event.pull_request.merged && 3066993 || (github.event.action == 'closed' && 15158332 || 3447003) }}
          message: |
            ### ${{ github.event.pull_request.merged && '✅ Pull Request Merged' || (github.event.action == 'closed' && '❌ Pull Request Closed' || '🚀 Pull Request Update') }} [#${{ github.event.pull_request.number }}]
            **Title:** ${{ github.event.pull_request.title }}
            **Author:** ${{ github.event.pull_request.user.login }}
            **Action:** `${{ github.event.action }}`
            **Branches:** `${{ github.event.pull_request.head.ref }}` ➔ `${{ github.event.pull_request.base.ref }}`
            **Status:** ${{ github.event.pull_request.draft && '📝 Draft' || '✅ Ready' }}
            
            **Reviewers:** ${{ join(github.event.pull_request.requested_reviewers.*.login, ', ') || 'None assigned' }}
            
            **Description:** 
            > ${{ github.event.pull_request.body || 'No description provided.' }}
            
            [View Pull Request](<${{ github.event.pull_request.html_url }}>)
